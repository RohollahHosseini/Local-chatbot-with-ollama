
name: localai-chatbot

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: localai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: localai-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: src/LocalChatbot.Api/Dockerfile

    ports:
      - "${API_PORT:-5000}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Ollama__BaseUrl: http://host.docker.internal:11434/
      Ollama__ChatModel: qwen3:4b
      Ollama__TimeoutSeconds: 120

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  open-webui:
    image: ghcr.io/open-webui/open-webui:slim
    container_name: localai-open-webui
    restart: unless-stopped

    ports:
      - "${OPEN_WEBUI_PORT}:8080"

    volumes:
      - open_webui_data:/app/backend/data

    depends_on:
      - api

volumes:
  postgres_data:
  open_webui_data:
